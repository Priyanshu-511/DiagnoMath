name: DiagnoMath

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug repo contents
        run: |
          echo "Working directory:"
          pwd
          echo "Top-level files:"
          ls -la
          echo "Looking for package.json anywhere in repo:"
          find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Get APK URL
        run: |
          node -e "
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('eas-build.json', 'utf8')
          );

          const build = Array.isArray(data) ? data[0] : data;

          if (!build.artifacts?.buildUrl) {
            console.error('APK URL not found');
            process.exit(1);
          }

          fs.writeFileSync(
            'apk-url.txt',
            build.artifacts.buildUrl
          );

          console.log('APK URL found');
          "

      - name: Download APK
        run: |
          curl -L "$(cat apk-url.txt)" -o DiagnoMath.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiagnoMath-APK
          path: DiagnoMath.apk
          if-no-files-found: error
          retention-days: 30